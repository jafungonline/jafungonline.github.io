
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071A3B">
    <title>JAFUNG Online</title>

    <!-- Favicon tetap -->
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #071A3B;
        }

        /* Aplikasi utama: tidak diubah */
        #appFrame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
            opacity: 0;
            transition: opacity .45s ease;
        }

        #appFrame.ready {
            opacity: 1;
        }

        /* Layar pembuka */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 24px;
            color: #fff;
            text-align: center;
            background:
                radial-gradient(
                    circle at 50% 38%,
                    rgba(35, 110, 220, .34),
                    transparent 42%
                ),
                linear-gradient(
                    145deg,
                    #06142E,
                    #103B78 55%,
                    #071A3B
                );
            transition: opacity .4s ease, visibility .4s ease;
        }

        #loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Wadah logo dan spinner */
        .logo-wrap {
            position: relative;
            width: 124px;
            height: 124px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            flex-shrink: 0;
            isolation: isolate;
        }

        /* Cincin cahaya dasar */
        .logo-wrap::after {
            content: "";
            position: absolute;
            inset: 5px;
            border: 1px solid rgba(125, 190, 255, .24);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Spinner bercahaya yang mengelilingi logo */
        .logo-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 3px solid rgba(96, 165, 250, .16);
            border-top-color: #FFFFFF;
            border-right-color: #60A5FA;
            border-radius: 50%;
            box-shadow:
                0 0 7px rgba(96, 165, 250, .32),
                inset 0 0 4px rgba(96, 165, 250, .10);
            pointer-events: none;

            /* Animasi utama spinner */
            -webkit-animation: logoSpinner 1.2s linear infinite;
            animation: logoSpinner 1.2s linear infinite;
        }

        /* Logo favicon: tetap sama */
        .logo {
    display: block;
    position: relative;
    z-index: 1;
    width: 88px;
    height: 88px;
    object-fit: contain;

    /* Hilangkan kotak putih di belakang logo */
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    box-shadow: none;

    /* Animasi logo tetap ringan */
    -webkit-animation: breathe 2.5s ease-in-out infinite;
    animation: breathe 2.5s ease-in-out infinite;
}

        .app-title {
            margin: 8px 0 0;
            font-size: clamp(25px, 5vw, 34px);
            font-weight: 800;
            letter-spacing: .5px;
            text-shadow: 0 0 18px rgba(92, 170, 255, .4);
        }

        .subtitle {
            margin: 0;
            color: #C7DEFF;
            font-size: 13px;
            letter-spacing: .3px;
        }

        /* Quote motivasi: ringan, statis, dan responsif */
        .motivation-quote {
            width: min(520px, 88vw);
            margin: 2px 0 0;
            color: #E5F0FF;
            font-size: clamp(12px, 2.5vw, 14px);
            line-height: 1.65;
            font-style: italic;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .22);
        }

        /* Teks loading saja, tanpa garis animasi */
        .loading-area {
            width: min(230px, 75vw);
            margin-top: 20px;
        }

        .loading-text {
            margin-top: 4px;
            color: #D6E7FF;
            font-size: 12px;

            -webkit-animation: pulse 1.8s ease-in-out infinite;
            animation: pulse 1.8s ease-in-out infinite;
        }

        .footer {
            position: absolute;
            bottom: 22px;
            color: rgba(220, 235, 255, .65);
            font-size: 10px;
            letter-spacing: .5px;
        }

        /* Putaran spinner */
        @-webkit-keyframes logoSpinner {
            from {
                -webkit-transform: rotate(0deg);
            }
            to {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes logoSpinner {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Efek napas ringan pada logo */
        @-webkit-keyframes breathe {
            0%, 100% {
                -webkit-transform: scale(1);
            }
            50% {
                -webkit-transform: scale(1.035);
            }
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.035);
            }
        }

        /* Animasi teks */
        @-webkit-keyframes pulse {
            0%, 100% { opacity: .7; }
            50% { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { opacity: .7; }
            50% { opacity: 1; }
        }
    </style>
</head>

<body>

    <!-- Layar loading -->
    <div id="loader" role="status" aria-live="polite">

        <div class="logo-wrap">
            <img
                class="logo"
                src="favicon.ico?v=2"
                alt="Logo JAFUNG Online"
            >
        </div>

        <h1 class="app-title">JAFUNG Online</h1>

        <p class="subtitle">
        </p>

        <p class="motivation-quote" id="motivationQuote"></p>

        <div class="loading-area">
            <div class="loading-text">
            </div>
        </div>

        <div class="footer"></div>
    </div>

    <!-- Google Apps Script: URL tetap -->
    <iframe
        id="appFrame"
        title="Aplikasi JAFUNG Online"
        src="https://script.google.com/macros/s/AKfycbx2_cfubjPRa_jQEs65VCz9uo3IDVL6f-EkIlUqhH8ouSbRame6NCJn9BXXUmi1oQX0/exec"
        allow="clipboard-read; clipboard-write"
        onload="hideLoader()"
    ></iframe>

    <script>
        (function () {
            var loader = document.getElementById('loader');
            var frame = document.getElementById('appFrame');
            var finished = false;

            /* Pilih satu quote secara acak setiap halaman dibuka */
            var quotes = [
                'Pelayanan yang tulus adalah wujud nyata pengabdian kepada masyarakat.',
                'Integritas berarti tetap lurus, wujud nyata pengabdian kepada masyarakat.',
                'Disiplin dalam tugas, jujur dalam tindakan, dan tulus dalam pelayanan.',
                'Jadilah ASN yang bekerja dengan hati, bertindak dengan tanggung jawab, dan memberi manfaat.',
                'Kepercayaan publik tumbuh dari sikap konsisten, kerja keras, dan integritas.'
            ];
            var quoteElement = document.getElementById('motivationQuote');
            if (quoteElement) {
                quoteElement.textContent = quotes[Math.floor(Math.random() * quotes.length)];
            }

            window.hideLoader = function () {
                if (finished) return;
                finished = true;

                frame.classList.add('ready');
                loader.classList.add('hide');

                setTimeout(function () {
                    if (loader.parentNode) {
                        loader.parentNode.removeChild(loader);
                    }
                }, 500);
            };
        })();
    </script>

</body>
</html>
